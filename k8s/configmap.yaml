apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: urban-streaming
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: urban_sensors
  PRODUCER_MESSAGE_COUNT: "180"
  PRODUCER_INTERVAL_SECONDS: "1"
  SPARK_CHECKPOINT_LOCATION: /checkpoint/urban-sensors
  SPARK_LOG_LEVEL: WARN
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: urban-streaming
data:
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0.kafka-headless.urban-streaming.svc.cluster.local:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m