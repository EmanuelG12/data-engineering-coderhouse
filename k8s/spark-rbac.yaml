apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: urban-streaming
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  namespace: urban-streaming
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  namespace: urban-streaming
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: urban-streaming
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver